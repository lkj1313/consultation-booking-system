services:
  postgres:
    image: postgres:16-alpine
    container_name: consultation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consultation_booking
    ports:
      - "55432:5432"
    volumes:
      - consultation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consultation_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  consultation_postgres_data:
